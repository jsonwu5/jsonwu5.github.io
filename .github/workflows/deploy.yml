name: Deploy VitePress

on:
  push:
    branches:
      - master  # 修改为你的默认分支
    paths:
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'  # 改动工作流本身也应触发，便于修复验证

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本交由 package.json 的 packageManager 字段决定（pnpm@9.15.9，满足 ≥9
        # 以读取 pnpm-lock.yaml 的 lockfileVersion 9.0）。此处不可再写 version，
        # 否则会报 ERR_PNPM_BAD_PM_VERSION（两处版本声明冲突）。

      - name: Install dependencies
        run: pnpm install

      - name: Build VitePress
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REPOSITORY_NAME: jsonwu5/jsonwu5.github.io
          BRANCH: gh-pages  # 修改为你想要部署到的分支
          FOLDER: dist  # 修改为 VitePress 输出目录
